name: conformance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Compile reference code
        run: python -m py_compile reference/*.py
      - name: Run unit, adversarial, schema, and generated-artifact conformance tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON syntax across schemas examples and adversarial corpora
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path('schemas'), Path('examples'), Path('adversarial')]
          for root in roots:
              for path in sorted(root.glob('*.json')):
                  json.loads(path.read_text(encoding='utf-8'))
                  print('PASS', path)
          PY
      - name: Exercise AAB policy-gate demo
        run: python reference/authority_gate.py --policy examples/authority_policy.json --requests examples/action_requests.json
      - name: Exercise AMCS unauthenticated round trip
        run: |
          tmp="$(mktemp -d)"
          python reference/amcs.py seal --input examples/chat_minimal.json --out-dir "$tmp" --cell-name CI_CELL
          python reference/amcs.py verify --cell "$tmp/CI_CELL.tar.gz"
      - name: Exercise AMCS authenticated-root round trip
        run: |
          tmp="$(mktemp -d)"
          key="1111111111111111111111111111111111111111111111111111111111111111"
          python reference/amcs.py seal --input examples/chat_minimal.json --out-dir "$tmp" --cell-name CI_AUTH --seal-key-hex "$key"
          python reference/amcs.py verify --cell "$tmp/CI_AUTH.tar.gz" --seal-key-hex "$key"
