name: conformance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "hardening/**"
      - "evaluation/**"

permissions:
  contents: read

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned conformance dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python reference and evaluation code
        run: |
          python -m py_compile reference/*.py
          python -m py_compile evaluation/*.py evaluation/mediated_agent/*.py evaluation/portable/*.py
      - name: Compile portable C type profile
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only tests/c_portability_smoke.c
      - name: Compile portable C++ type profile
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only tests/cpp_portability_smoke.cpp
      - name: Run unit, adversarial, schema, and generated-artifact conformance tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON syntax across schemas examples adversarial and evaluation corpora
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path('schemas'), Path('examples'), Path('adversarial'), Path('evaluation')]
          for root in roots:
              for path in sorted(root.rglob('*.json')):
                  json.loads(path.read_text(encoding='utf-8'))
                  print('PASS', path)
          PY
      - name: Verify Python C and C++ Canonical JSON golden vectors
        run: |
          tmp="$(mktemp -d)"
          cc -std=c11 -Wall -Wextra -Werror -pedantic evaluation/portable/canonical_vectors.c -o "$tmp/canonical-c"
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic evaluation/portable/canonical_vectors.cpp -o "$tmp/canonical-cpp"
          python evaluation/portable/check_vectors.py --c "$tmp/canonical-c" --cpp "$tmp/canonical-cpp"
      - name: Exercise AAB policy-gate demo
        run: python reference/authority_gate.py --policy examples/authority_policy.json --requests examples/action_requests.json
      - name: Exercise schema-validating AMCS unauthenticated round trip
        run: |
          tmp="$(mktemp -d)"
          python reference/amcs_runtime.py seal --input examples/chat_minimal.json --out-dir "$tmp" --cell-name CI_CELL
          python reference/amcs_runtime.py verify --cell "$tmp/CI_CELL.tar.gz"
      - name: Reject schema-invalid AMCS input before sealing
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/bad.json" <<'JSON'
          [{"role":"user","content":"test","timestamp":123,"no_response_required":true}]
          JSON
          if python reference/amcs_runtime.py seal --input "$tmp/bad.json" --out-dir "$tmp" --cell-name BAD_CELL; then
            echo "invalid input unexpectedly sealed"
            exit 1
          fi
          test ! -e "$tmp/BAD_CELL.tar.gz"
      - name: Exercise schema-validating AMCS authenticated-root round trip
        run: |
          tmp="$(mktemp -d)"
          key="1111111111111111111111111111111111111111111111111111111111111111"
          python reference/amcs_runtime.py seal --input examples/chat_minimal.json --out-dir "$tmp" --cell-name CI_AUTH --seal-key-hex "$key"
          python reference/amcs_runtime.py verify --cell "$tmp/CI_AUTH.tar.gz" --seal-key-hex "$key"
      - name: Run evaluation release and evidence readiness gate
        run: |
          tmp="$(mktemp -d)"
          python evaluation/release_check.py --write "$tmp/evaluation-manifest.json"
          python -m json.tool "$tmp/evaluation-manifest.json" >/dev/null
      - name: Run deterministic E0 mediated-agent evidence suite
        run: |
          tmp="$(mktemp -d)"
          python -m evaluation.mediated_agent.runner --out "$tmp/e0"
          python - <<'PY' "$tmp/e0/summary.json"
          import json, sys
          summary = json.load(open(sys.argv[1], encoding='utf-8'))
          assert summary['unauthorized_action_events'] == 0, summary
          assert summary['unauthorized_bypass_attempts'] >= 1, summary
          print('PASS E0', summary)
          PY
