name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile reference code
        run: python -m py_compile reference/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in list(Path('schemas').glob('*.json')) + list(Path('examples').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print('PASS', path)
          PY
      - name: Exercise AAB demo
        run: python reference/authority_gate.py --policy examples/authority_policy.json --requests examples/action_requests.json
